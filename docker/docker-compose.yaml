# Magic-Erasarr — see README for setup. Image tag: latest (main) or dev (dev branch).
services:
  magic-erasarr:
    image: ghcr.io/shawnthompson/magic-erasarr
    container_name: magic-erasarr
    ports:
      - "${MAGIC_ERASARR_PORT:-5000}:5000"
    # Compose does not pass its project .env to the container automatically.
    # This explicitly loads the repository-root .env at ../.env.
    env_file:
      - ../.env
    restart: unless-stopped
